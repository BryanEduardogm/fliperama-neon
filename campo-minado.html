<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Campo Minado · Fliperama Neon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --fundo: #0b0820; --painel: #151033; --borda: #2e2766; --texto: #f1eeff; --suave: #a39fd0;
    --ciano: #00f0ff; --rosa: #ff2bd6; --amarelo: #ffe600;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #2a1460, var(--fundo) 65%);
    color: var(--texto); font-family: "Segoe UI", Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 16px 24px;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  .topo { width: 100%; max-width: 520px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .voltar { color: var(--suave); text-decoration: none; font-size: 0.85rem; border: 1px solid var(--borda); padding: 6px 10px; border-radius: 8px; }
  .voltar:hover { color: var(--ciano); border-color: var(--ciano); }
  h1 { font-family: "Press Start 2P", monospace; font-size: 0.85rem; color: var(--rosa); text-shadow: 0 0 8px var(--rosa); }
  main { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }

  .barra { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .info { background: var(--painel); border: 1px solid var(--borda); border-radius: 8px; padding: 6px 12px; font-size: 0.85rem; color: var(--suave); }
  .info b { color: var(--amarelo); }
  .botao { background: var(--painel); color: var(--texto); border: 1px solid var(--borda); border-radius: 8px; padding: 7px 12px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
  .botao.ativo { border-color: var(--rosa); color: var(--rosa); box-shadow: 0 0 10px rgba(255, 43, 214, 0.4); }

  .tabuleiro {
    display: grid;
    gap: 3px;
    padding: 8px;
    background: #06041a;
    border: 2px solid var(--rosa);
    border-radius: 10px;
    box-shadow: 0 0 18px rgba(255, 43, 214, 0.4);
  }

  .casa {
    width: var(--t); height: var(--t);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: calc(var(--t) * 0.55);
    border-radius: 4px;
    background: linear-gradient(145deg, #3b2f86, #261d5c);
    cursor: pointer;
  }
  .casa:hover { filter: brightness(1.25); }
  .casa.aberta { background: #120c30; cursor: default; filter: none; }
  .casa.mina { background: #5a0f2a; }
  .casa.explodiu { background: var(--rosa); }

  .n1 { color: #00f0ff; } .n2 { color: #39ff88; } .n3 { color: #ff5a5a; } .n4 { color: #b06bff; }
  .n5 { color: #ffb000; } .n6 { color: #00ffd0; } .n7 { color: #fff; } .n8 { color: #aaa; }

  .mensagem { min-height: 1.4em; font-weight: 800; color: var(--amarelo); text-align: center; }
  .dica { font-size: 0.75rem; color: var(--suave); text-align: center; max-width: 420px; }
</style>
</head>
<body>
<header class="topo">
  <a href="fliperama-neon.html" class="voltar">← Fliperama</a>
  <h1>CAMPO MINADO</h1>
  <div class="info">RECORDE <b id="recorde">—</b></div>
</header>

<main>
  <div class="barra">
    <button class="botao ativo" data-nivel="facil">Fácil</button>
    <button class="botao" data-nivel="medio">Médio</button>
    <button class="botao" data-nivel="dificil">Difícil</button>
  </div>
  <div class="barra">
    <div class="info">💣 <b id="restantes">10</b></div>
    <div class="info">⏱ <b id="tempo">0</b>s</div>
    <button class="botao" id="modoBandeira">🚩 Bandeira: OFF</button>
    <button class="botao" id="reiniciar">↻ Novo</button>
  </div>
  <div class="tabuleiro" id="tabuleiro"></div>
  <div class="mensagem" id="mensagem"></div>
  <p class="dica">Clique para abrir · botão direito ou toque longo para marcar 🚩 · no celular, ligue o modo Bandeira</p>
</main>

<script>
  const NIVEIS = {
    facil:   { linhas: 9,  colunas: 9,  minas: 10 },
    medio:   { linhas: 12, colunas: 12, minas: 24 },
    dificil: { linhas: 14, colunas: 12, minas: 36 }
  };

  let nivel = "facil", campo, abertas, bandeiras, primeiroClique, fimDeJogo, segundos, timer, modoBandeira = false;
  const tab = document.getElementById("tabuleiro");

  const chave = () => `fliperama_campo_${nivel}`;
  function lerRecorde() { try { return Number(localStorage.getItem(chave())) || 0; } catch (e) { return 0; } }
  function salvarRecorde(v) { try { localStorage.setItem(chave(), v); } catch (e) {} }

  let audio = null;
  function bip(freq, dur, tipo = "square", vol = 0.05) {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = tipo; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.connect(g).connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (e) {}
  }

  function novoJogo() {
    const { linhas, colunas, minas } = NIVEIS[nivel];
    campo = Array.from({ length: linhas }, () => Array.from({ length: colunas }, () => ({ mina: false, vizinhas: 0, aberta: false, bandeira: false })));
    abertas = 0;
    bandeiras = 0;
    primeiroClique = true;
    fimDeJogo = false;
    segundos = 0;
    clearInterval(timer);
    document.getElementById("tempo").textContent = 0;
    document.getElementById("restantes").textContent = minas;
    document.getElementById("mensagem").textContent = "";
    const r = lerRecorde();
    document.getElementById("recorde").textContent = r ? `${r}s` : "—";

    // tamanho das casas cabe na tela do celular
    const t = Math.floor(Math.min(34, (Math.min(innerWidth, 520) - 60) / colunas - 3));
    tab.style.setProperty("--t", `${t}px`);
    tab.style.gridTemplateColumns = `repeat(${colunas}, ${t}px)`;
    tab.innerHTML = "";
    for (let l = 0; l < linhas; l++) for (let c = 0; c < colunas; c++) {
      const d = document.createElement("div");
      d.className = "casa";
      d.dataset.l = l;
      d.dataset.c = c;
      tab.appendChild(d);
    }
  }

  // As minas só são colocadas no primeiro clique, longe dele (nunca perde na primeira jogada)
  function espalharMinas(l0, c0) {
    const { linhas, colunas, minas } = NIVEIS[nivel];
    let colocadas = 0;
    while (colocadas < minas) {
      const l = Math.floor(Math.random() * linhas), c = Math.floor(Math.random() * colunas);
      if (campo[l][c].mina || (Math.abs(l - l0) <= 1 && Math.abs(c - c0) <= 1)) continue;
      campo[l][c].mina = true;
      colocadas++;
    }
    for (let l = 0; l < linhas; l++) for (let c = 0; c < colunas; c++) {
      campo[l][c].vizinhas = vizinhos(l, c).filter(([a, b]) => campo[a][b].mina).length;
    }
    timer = setInterval(() => { segundos++; document.getElementById("tempo").textContent = segundos; }, 1000);
  }

  function vizinhos(l, c) {
    const lista = [];
    for (let dl = -1; dl <= 1; dl++) for (let dc = -1; dc <= 1; dc++) {
      const a = l + dl, b = c + dc;
      if ((dl || dc) && campo[a] && campo[a][b]) lista.push([a, b]);
    }
    return lista;
  }

  const casaEl = (l, c) => tab.children[l * NIVEIS[nivel].colunas + c];

  function abrir(l, c) {
    if (fimDeJogo) return;
    if (primeiroClique) { espalharMinas(l, c); primeiroClique = false; }
    const casa = campo[l][c];
    if (casa.aberta || casa.bandeira) return;
    if (casa.mina) return explodir(l, c);

    // abre em cadeia as casas sem número
    const fila = [[l, c]];
    while (fila.length) {
      const [a, b] = fila.pop();
      const k = campo[a][b];
      if (k.aberta || k.bandeira) continue;
      k.aberta = true;
      abertas++;
      const el = casaEl(a, b);
      el.classList.add("aberta");
      if (k.vizinhas) { el.textContent = k.vizinhas; el.classList.add("n" + k.vizinhas); }
      else vizinhos(a, b).forEach(v => fila.push(v));
    }
    bip(700, 0.03);

    const { linhas, colunas, minas } = NIVEIS[nivel];
    if (abertas === linhas * colunas - minas) vitoria();
  }

  function marcar(l, c) {
    if (fimDeJogo || primeiroClique) return;
    const casa = campo[l][c];
    if (casa.aberta) return;
    casa.bandeira = !casa.bandeira;
    bandeiras += casa.bandeira ? 1 : -1;
    casaEl(l, c).textContent = casa.bandeira ? "🚩" : "";
    document.getElementById("restantes").textContent = NIVEIS[nivel].minas - bandeiras;
    bip(casa.bandeira ? 1000 : 500, 0.04, "triangle");
  }

  function explodir(l, c) {
    fimDeJogo = true;
    clearInterval(timer);
    bip(120, 0.5, "sawtooth", 0.09);
    campo.forEach((linha, a) => linha.forEach((k, b) => {
      if (k.mina) {
        const el = casaEl(a, b);
        el.classList.add("aberta", "mina");
        el.textContent = "💣";
      }
    }));
    casaEl(l, c).classList.add("explodiu");
    document.getElementById("mensagem").textContent = "💥 BUM! Clique em ↻ Novo para tentar de novo.";
  }

  function vitoria() {
    fimDeJogo = true;
    clearInterval(timer);
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => bip(f, 0.15), i * 110));
    const r = lerRecorde();
    let msg = `🏆 VOCÊ VENCEU em ${segundos}s!`;
    if (!r || segundos < r) {
      salvarRecorde(segundos);
      document.getElementById("recorde").textContent = `${segundos}s`;
      msg += " Novo recorde!";
    }
    document.getElementById("mensagem").textContent = msg;
  }

  // Clique, botão direito e toque longo
  let toqueTimer = null, toqueLongo = false;
  tab.addEventListener("click", e => {
    const el = e.target.closest(".casa");
    if (!el || toqueLongo) { toqueLongo = false; return; }
    const l = +el.dataset.l, c = +el.dataset.c;
    if (modoBandeira) marcar(l, c); else abrir(l, c);
  });
  tab.addEventListener("contextmenu", e => {
    e.preventDefault();
    const el = e.target.closest(".casa");
    if (el) marcar(+el.dataset.l, +el.dataset.c);
  });
  tab.addEventListener("touchstart", e => {
    const el = e.target.closest(".casa");
    if (!el) return;
    toqueLongo = false;
    toqueTimer = setTimeout(() => { toqueLongo = true; marcar(+el.dataset.l, +el.dataset.c); if (navigator.vibrate) navigator.vibrate(30); }, 450);
  }, { passive: true });
  tab.addEventListener("touchend", () => clearTimeout(toqueTimer));
  tab.addEventListener("touchmove", () => clearTimeout(toqueTimer), { passive: true });

  document.getElementById("modoBandeira").addEventListener("click", e => {
    modoBandeira = !modoBandeira;
    e.currentTarget.textContent = `🚩 Bandeira: ${modoBandeira ? "ON" : "OFF"}`;
    e.currentTarget.classList.toggle("ativo", modoBandeira);
  });
  document.getElementById("reiniciar").addEventListener("click", novoJogo);
  document.querySelectorAll("[data-nivel]").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll("[data-nivel]").forEach(x => x.classList.remove("ativo"));
    b.classList.add("ativo");
    nivel = b.dataset.nivel;
    novoJogo();
  }));

  novoJogo();
</script>
</body>
</html>
