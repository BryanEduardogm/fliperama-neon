<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mundo de Blocos</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb; font-family: sans-serif; }
  #mira { position: fixed; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; pointer-events: none; }
  #mira::before, #mira::after { content: ""; position: absolute; background: #fff; box-shadow: 0 0 2px #000; }
  #mira::before { left: 7px; top: 0; width: 2px; height: 16px; }
  #mira::after { top: 7px; left: 0; width: 16px; height: 2px; }
  #hud { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 6px; }
  .slot { width: 40px; height: 40px; border: 3px solid rgba(0,0,0,.4); border-radius: 4px; color: #fff; font-weight: bold;
          display: flex; align-items: flex-end; justify-content: flex-end; padding: 2px 4px; box-sizing: border-box; text-shadow: 0 0 3px #000; }
  .slot.ativo { border-color: #fff; transform: scale(1.12); }
  #inicio { position: fixed; inset: 0; background: rgba(0,0,0,.55); color: #fff; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; cursor: pointer; }
  #inicio h1 { margin: 0 0 12px; }
  #inicio p { margin: 4px; }

  /* ===== Controles de toque (celular) ===== */
  #toque { position: fixed; inset: 0; z-index: 9; display: none; touch-action: none; -webkit-user-select: none; user-select: none; }
  body.toque.em-jogo #toque { display: block; }
  #toque .zona { position: absolute; top: 0; bottom: 0; touch-action: none; }
  #toque .zona.esq { left: 0; width: 45%; }
  #toque .zona.dir { right: 0; width: 55%; }
  /* analógico: fica parado no canto (bem clarinho) e vai para onde o dedo encostar */
  #toque .base { position: absolute; left: 96px; top: calc(100% - 96px); width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.35); background: rgba(255, 255, 255, 0.06); pointer-events: none; opacity: 0.5; }
  #toque .base.ativa { opacity: 1; }
  #toque .pino { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255, 255, 255, 0.55); }
  .btn-toque { position: absolute; width: 60px; height: 60px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.55); background: rgba(10, 10, 20, 0.45);
    color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; touch-action: none;
    font: 800 9px/1.1 "Segoe UI", Arial, sans-serif; letter-spacing: 0.5px; text-shadow: 0 1px 2px #000; }
  .btn-toque .ic { font-size: 21px; line-height: 1; margin-bottom: 2px; }
  .btn-toque.principal { width: 88px; height: 88px; font-size: 11px; border-width: 3px; background: rgba(255, 255, 255, 0.16); }
  .btn-toque.principal .ic { font-size: 30px; }
  .btn-toque.mini { width: 44px; height: 44px; }
  .btn-toque.mini .ic { font-size: 18px; margin: 0; }
  .btn-toque.ativo { background: rgba(255, 255, 255, 0.45); transform: scale(0.93); }
  #dicaToque { position: fixed; inset: 0; z-index: 10; pointer-events: none; display: none; }
  #dicaToque div { position: absolute; top: 34%; transform: translateY(-50%); width: 38%; text-align: center; color: #fff;
    font: 800 15px/1.45 "Segoe UI", Arial, sans-serif; text-shadow: 0 2px 6px #000; background: rgba(0, 0, 0, 0.5); border-radius: 14px; padding: 12px; }
  #dicaToque .e { left: 4%; }
  #dicaToque .d { right: 4%; }
  #dicaToque.mostrar { display: block; animation: sumirDica 5s forwards; }
  @keyframes sumirDica { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
  #girar { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; text-align: center;
    background: rgba(0, 0, 0, 0.93); color: #fff; font: 800 1.4rem/1.6 "Segoe UI", Arial, sans-serif; }
  #girar small { font-size: 0.9rem; font-weight: 400; opacity: 0.7; }
  @media (orientation: portrait) { body.toque.em-jogo #girar { display: flex; } }
  body.toque #hud { bottom: auto; top: 12px; }
</style>
</head>
<body>
<div id="mira"></div>
<div id="hud"></div>
<div id="inicio">
  <h1>Mundo de Blocos</h1>
  <p><b>Clique para jogar</b></p>
  <p>W A S D: andar · Espaço: pular · Mouse: olhar</p>
  <p>1 2 3 4: trocar cor · Botão esquerdo: colocar bloco · Botão direito: destruir</p>
  <p>Esc: pausar</p>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

// Cena e céu (equivalente ao Sky() do Ursina)
const cena = new THREE.Scene();
cena.background = new THREE.Color(0x87ceeb);
cena.fog = new THREE.Fog(0x87ceeb, 20, 60);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 200);
const renderizador = new THREE.WebGLRenderer({ antialias: true });
renderizador.setSize(innerWidth, innerHeight);
renderizador.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderizador.domElement);

cena.add(new THREE.AmbientLight(0xffffff, 0.7));
const sol = new THREE.DirectionalLight(0xffffff, 0.9);
sol.position.set(10, 20, 5);
cena.add(sol);

// Textura 'white_cube': branco com borda cinza
const tela = document.createElement('canvas');
tela.width = tela.height = 64;
const ctx = tela.getContext('2d');
ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 64, 64);
ctx.strokeStyle = '#999'; ctx.lineWidth = 4; ctx.strokeRect(2, 2, 60, 60);
const textura = new THREE.CanvasTexture(tela);
textura.magFilter = THREE.NearestFilter;
textura.colorSpace = THREE.SRGBColorSpace;

const geometria = new THREE.BoxGeometry(1, 1, 1);
const materiais = {};
function material(cor) {
  if (!materiais[cor]) materiais[cor] = new THREE.MeshLambertMaterial({ color: cor, map: textura });
  return materiais[cor];
}

// Blocos guardados por posição "x,y,z"
const blocos = new Map();
const chave = (x, y, z) => `${x},${y},${z}`;

function criarBloco(x, y, z, cor) {
  const k = chave(x, y, z);
  if (blocos.has(k)) return;
  const bloco = new THREE.Mesh(geometria, material(cor));
  bloco.position.set(x, y, z);
  cena.add(bloco);
  blocos.set(k, bloco);
}

function destruirBloco(bloco) {
  cena.remove(bloco);
  blocos.delete(chave(bloco.position.x, bloco.position.y, bloco.position.z));
}

// Chão 16x16
for (let x = 0; x < 16; x++)
  for (let z = 0; z < 16; z++)
    criarBloco(x, 0, z, 0xffffff);

// Cores (teclas 1 a 4)
const cores = { '1': 0xff0000, '2': 0xff8000, '3': 0xffff00, '4': 0x00c000 };
let cor = 0x808080;

const hud = document.getElementById('hud');
for (const [tecla, c] of Object.entries(cores)) {
  const slot = document.createElement('div');
  slot.className = 'slot';
  slot.dataset.tecla = tecla;
  slot.style.background = '#' + c.toString(16).padStart(6, '0');
  slot.textContent = tecla;
  hud.appendChild(slot);
}
function atualizarHud(tecla) {
  for (const s of hud.children) s.classList.toggle('ativo', s.dataset.tecla === tecla);
}

// Jogador (FirstPersonController): posição = pés
const controles = new PointerLockControls(camera, document.body);
const jogador = { pos: new THREE.Vector3(8, 0.5, 2), vel: new THREE.Vector3(), noChao: false };
const LARGURA = 0.3, ALTURA = 1.8, OLHOS = 1.6;
const VELOCIDADE = 5, PULO = 7, GRAVIDADE = 20;
camera.position.set(8, 0.5 + OLHOS, 2);
camera.lookAt(8, 0.5 + OLHOS, 10);

const inicio = document.getElementById('inicio');
inicio.addEventListener('click', () => { if (!TOQUE) controles.lock(); });
controles.addEventListener('lock', () => inicio.style.display = 'none');
controles.addEventListener('unlock', () => inicio.style.display = 'flex');

const teclas = {};
addEventListener('keydown', e => {
  teclas[e.code] = true;
  if (e.key in cores) { cor = cores[e.key]; atualizarHud(e.key); }
});
addEventListener('keyup', e => teclas[e.code] = false);

function colide(p) {
  const x0 = Math.round(p.x - LARGURA), x1 = Math.round(p.x + LARGURA);
  const y0 = Math.round(p.y), y1 = Math.round(p.y + ALTURA - 0.01);
  const z0 = Math.round(p.z - LARGURA), z1 = Math.round(p.z + LARGURA);
  for (let x = x0; x <= x1; x++)
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++)
        if (blocos.has(chave(x, y, z))) return true;
  return false;
}

function mover(dt) {
  const frente = new THREE.Vector3();
  camera.getWorldDirection(frente);
  frente.y = 0; frente.normalize();
  const direita = new THREE.Vector3().crossVectors(frente, camera.up);

  const dir = new THREE.Vector3();
  if (teclas.KeyW) dir.add(frente);
  if (teclas.KeyS) dir.sub(frente);
  if (teclas.KeyD) dir.add(direita);
  if (teclas.KeyA) dir.sub(direita);
  if (dir.lengthSq() > 0) dir.normalize().multiplyScalar(VELOCIDADE);

  jogador.vel.x = dir.x;
  jogador.vel.z = dir.z;
  jogador.vel.y -= GRAVIDADE * dt;
  if (teclas.Space && jogador.noChao) jogador.vel.y = PULO;

  // Move um eixo por vez e desfaz se bater em um bloco
  jogador.noChao = false;
  for (const eixo of ['x', 'y', 'z']) {
    const antes = jogador.pos[eixo];
    jogador.pos[eixo] += jogador.vel[eixo] * dt;
    if (colide(jogador.pos)) {
      jogador.pos[eixo] = antes;
      if (eixo === 'y') {
        if (jogador.vel.y < 0) jogador.noChao = true;
        jogador.vel.y = 0;
      }
    }
  }

  // Caiu do mundo: volta ao início
  if (jogador.pos.y < -30) { jogador.pos.set(8, 0.5, 2); jogador.vel.set(0, 0, 0); }

  camera.position.set(jogador.pos.x, jogador.pos.y + OLHOS, jogador.pos.z);
}

// Mouse: esquerdo coloca, direito destrói
const raio = new THREE.Raycaster();
raio.far = 8;
addEventListener('contextmenu', e => e.preventDefault());

// Segurando o esquerdo e mexendo o mouse, vai pintando blocos na superfície.
// Os blocos colocados durante o arraste não servem de alvo, senão viraria uma torre vindo na sua direção.
let segurandoEsquerdo = false;
const colocadosNoArraste = new Set();

function mirar(ignorar) {
  raio.setFromCamera(new THREE.Vector2(0, 0), camera);
  const alvos = [...blocos.values()].filter(b => !ignorar || !ignorar.has(b));
  return raio.intersectObjects(alvos)[0];
}

function colocarBloco() {
  const alvo = mirar(colocadosNoArraste);
  if (!alvo) return;
  const p = alvo.object.position.clone().add(alvo.face.normal);
  if (blocos.has(chave(p.x, p.y, p.z))) return;
  criarBloco(p.x, p.y, p.z, cor);
  const novo = blocos.get(chave(p.x, p.y, p.z));
  if (colide(jogador.pos)) destruirBloco(novo);
  else colocadosNoArraste.add(novo);
}

// Segurando o direito e mexendo o mouse, vai apagando os blocos que a mira encosta.
let segurandoDireito = false;

function tirarBloco() {
  const alvo = mirar();
  if (alvo) destruirBloco(alvo.object);
}

addEventListener('mousedown', e => {
  if (!controles.isLocked) return;
  if (e.button === 0) {
    segurandoEsquerdo = true;
    colocadosNoArraste.clear();
    colocarBloco();
  }
  if (e.button === 2) {
    segurandoDireito = true;
    tirarBloco();
  }
});
addEventListener('mousemove', () => {
  if (!controles.isLocked) return;
  if (segurandoEsquerdo) colocarBloco();
  if (segurandoDireito) tirarBloco();
});
addEventListener('mouseup', e => {
  if (e.button === 0) { segurandoEsquerdo = false; colocadosNoArraste.clear(); }
  if (e.button === 2) segurandoDireito = false;
});
controles.addEventListener('unlock', () => {
  segurandoEsquerdo = segurandoDireito = false;
  colocadosNoArraste.clear();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderizador.setSize(innerWidth, innerHeight);
});

const relogio = new THREE.Clock();
renderizador.setAnimationLoop(() => {
  const dt = Math.min(relogio.getDelta(), 0.05);
  if (controles.isLocked || jogandoToque) mover(dt);
  renderizador.render(cena, camera);
});

// ===== Controles de toque (celular e tablet) =====
// Todo jogo usa o mesmo jeito: analógico à esquerda, arrastar à direita para olhar,
// um botão grande principal com até 3 botões em volta e botões pequenos no topo.
// Os botões "apertam" as mesmas teclas do teclado, então o jogo funciona do mesmo jeito.
const TOQUE = matchMedia("(pointer: coarse)").matches && navigator.maxTouchPoints > 0;
function teclaVirtual(code, baixo) {
  document.dispatchEvent(new KeyboardEvent(baixo ? "keydown" : "keyup", { code, key: code, bubbles: true }));
}
// No celular, ao começar: tela cheia e tenta deixar deitado
function telaCheiaDeitada() {
  if (!TOQUE || document.fullscreenElement) return;
  const el = document.documentElement, pedir = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!pedir) return;
  try {
    const p = pedir.call(el);
    if (p && p.then) p.then(() => { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {}); }).catch(() => {});
  } catch (e) {}
}
// lugares fixos: o principal fica um pouco acima do canto (longe do selo do site)
const LUGARES_TOQUE = {
  principal: { right: "24px", bottom: "60px" },
  acoes: [{ right: "126px", bottom: "56px" }, { right: "116px", bottom: "142px" }, { right: "32px", bottom: "164px" }]
};
function montarToque(cfg) {
  if (!TOQUE) return;
  document.body.classList.add("toque");
  // ao girar o celular ou entrar em tela cheia, o jogo se reajusta ao novo tamanho
  const reajustar = () => setTimeout(() => dispatchEvent(new Event("resize")), 250);
  addEventListener("orientationchange", reajustar);
  document.addEventListener("fullscreenchange", reajustar);
  const criar = (cls, pai) => { const d = document.createElement("div"); d.className = cls; pai.appendChild(d); return d; };
  const raiz = document.createElement("div");
  raiz.id = "toque";
  document.body.appendChild(raiz);
  const girar = document.createElement("div");
  girar.id = "girar";
  girar.innerHTML = "<div>📱 ↻<br>Gire o celular<br><small>o jogo fica melhor deitado</small></div>";
  document.body.appendChild(girar);
  const dica = document.createElement("div");
  dica.id = "dicaToque";
  if (cfg.analogico) dica.innerHTML = `<div class="e">🕹️ Arraste o dedo aqui<br>para <b>ANDAR</b></div>` + (cfg.olhar ? `<div class="d">👆 Arraste o dedo aqui<br>para <b>OLHAR</b></div>` : "");
  document.body.appendChild(dica);
  const acharToque = (e, id) => [...e.changedTouches].find(t => t.identifier === id);

  if (cfg.analogico) {
    const zona = criar("zona esq", raiz), base = criar("base", raiz), pino = criar("pino", base);
    let id = null, ox = 0, oy = 0;
    const ligadas = {};
    const ajustar = (code, on) => { if (!!ligadas[code] !== on) { ligadas[code] = on; teclaVirtual(code, on); } };
    zona.addEventListener("touchstart", e => {
      e.preventDefault();
      if (id !== null) return;
      const t = e.changedTouches[0];
      id = t.identifier; ox = t.clientX; oy = t.clientY;
      base.style.left = ox + "px"; base.style.top = oy + "px";
      base.classList.add("ativa");
      pino.style.transform = "";
    }, { passive: false });
    zona.addEventListener("touchmove", e => {
      e.preventDefault();
      const t = acharToque(e, id);
      if (!t) return;
      let dx = t.clientX - ox, dy = t.clientY - oy;
      const dist = Math.hypot(dx, dy), max = 56;
      if (dist > max) { dx *= max / dist; dy *= max / dist; }
      pino.style.transform = `translate(${dx}px, ${dy}px)`;
      const lim = 15;
      ajustar("KeyW", dy < -lim); ajustar("KeyS", dy > lim);
      ajustar("KeyA", dx < -lim); ajustar("KeyD", dx > lim);
      if (cfg.correr) ajustar("ShiftLeft", dist > 54); // empurrar até o fim = correr
    }, { passive: false });
    const fim = e => {
      if (!acharToque(e, id)) return;
      id = null;
      base.style.left = ""; base.style.top = "";
      base.classList.remove("ativa");
      pino.style.transform = "";
      Object.keys(ligadas).forEach(c => ajustar(c, false));
    };
    zona.addEventListener("touchend", fim);
    zona.addEventListener("touchcancel", fim);
  }

  if (cfg.olhar) {
    const zona = criar("zona dir", raiz);
    let id = null, ux = 0, uy = 0;
    zona.addEventListener("touchstart", e => {
      e.preventDefault();
      if (id !== null) return;
      const t = e.changedTouches[0];
      id = t.identifier; ux = t.clientX; uy = t.clientY;
    }, { passive: false });
    zona.addEventListener("touchmove", e => {
      e.preventDefault();
      const t = acharToque(e, id);
      if (!t) return;
      cfg.olhar(t.clientX - ux, t.clientY - uy);
      ux = t.clientX; uy = t.clientY;
    }, { passive: false });
    const fim = e => { if (acharToque(e, id)) id = null; };
    zona.addEventListener("touchend", fim);
    zona.addEventListener("touchcancel", fim);
  }

  const dinamicos = [];
  const botao = (b, tamanho, pos) => {
    const el = criar("btn-toque " + tamanho, raiz);
    el.innerHTML = `<span class="ic">${b.ic}</span>${tamanho === "mini" ? "" : b.txt || ""}`;
    Object.assign(el.style, pos);
    el.addEventListener("touchstart", e => {
      e.preventDefault(); e.stopPropagation();
      el.classList.add("ativo");
      if (b.tecla) teclaVirtual(b.tecla, true);
      if (b.aoApertar) b.aoApertar();
    }, { passive: false });
    const soltar = e => {
      e.preventDefault();
      el.classList.remove("ativo");
      if (b.tecla) teclaVirtual(b.tecla, false);
      if (b.aoSoltar) b.aoSoltar();
    };
    el.addEventListener("touchend", soltar);
    el.addEventListener("touchcancel", soltar);
    if (b.rotulo) dinamicos.push({ el, b, atual: "" });
  };
  if (cfg.principal) botao(cfg.principal, "principal", LUGARES_TOQUE.principal);
  (cfg.acoes || []).forEach((b, i) => botao(b, "", LUGARES_TOQUE.acoes[i]));
  (cfg.livres || []).forEach(b => botao(b, b.tamanho || "", b.pos));
  const topo = cfg.topo || { botoes: [] };
  topo.botoes.forEach((b, i) => {
    const n = topo.botoes.length, passo = 52;
    const pos = topo.lado === "centro" ? { left: `calc(50% - ${(n * passo) / 2 - i * passo}px)`, top: topo.top || "10px" }
      : { right: `${14 + (n - 1 - i) * passo}px`, top: topo.top || "12px" };
    botao(b, "mini", pos);
  });

  // os controles só aparecem durante a partida (com a dica nas primeiras vezes)
  let antes = false, dicas = 0;
  (function vigiar() {
    const on = !!cfg.ativo();
    document.body.classList.toggle("em-jogo", on);
    if (on !== antes) {
      antes = on;
      if (on && cfg.aoAtivar) cfg.aoAtivar();
      if (!on && cfg.aoDesativar) cfg.aoDesativar();
      if (on && cfg.analogico && dicas < 2) { dicas++; dica.classList.remove("mostrar"); void dica.offsetWidth; dica.classList.add("mostrar"); }
    }
    for (const d of dinamicos) {
      const [ic, txt] = d.b.rotulo();
      const chave = ic + txt;
      if (chave !== d.atual) { d.atual = chave; d.el.innerHTML = `<span class="ic">${ic}</span>${txt}`; }
    }
    requestAnimationFrame(vigiar);
  })();
  (cfg.telaCheia || []).forEach(id => { const el = document.getElementById(id); if (el) el.addEventListener("click", telaCheiaDeitada); });
}

// No celular não existe trava do mouse: tocar em "jogar" já começa
let jogandoToque = false;
if (TOQUE) {
  inicio.querySelector("p b").textContent = "Toque para jogar";
  inicio.addEventListener("click", () => { jogandoToque = true; inicio.style.display = "none"; telaCheiaDeitada(); });
}
const anguloToque = new THREE.Euler(0, 0, 0, "YXZ");
function proximaCor() {
  const chaves = Object.keys(cores);
  const atual = chaves.find(k => cores[k] === cor);
  const k = chaves[(chaves.indexOf(atual) + 1) % chaves.length];
  cor = cores[k];
  atualizarHud(k);
}
montarToque({
  ativo: () => jogandoToque,
  analogico: true,
  olhar: (dx, dy) => {
    anguloToque.setFromQuaternion(camera.quaternion);
    anguloToque.y -= dx * 0.005;
    anguloToque.x = Math.max(-1.5, Math.min(1.5, anguloToque.x - dy * 0.005));
    camera.quaternion.setFromEuler(anguloToque);
  },
  principal: { ic: "🧱", txt: "COLOCAR", aoApertar: () => { colocadosNoArraste.clear(); colocarBloco(); } },
  acoes: [{ ic: "⛏️", txt: "TIRAR", aoApertar: () => tirarBloco() }, { ic: "⤒", txt: "PULAR", tecla: "Space" }, { ic: "🎨", txt: "COR", aoApertar: proximaCor }]
});
</script>
</body>
</html>
